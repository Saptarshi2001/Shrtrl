name: shrtrl-tests

services:
  tests:
    image: shrtrl-tests:local
    build:
      context: .
      dockerfile: Dockerfile.test
    command:
      - -Pdocker-auth-url-tests
      - test
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
