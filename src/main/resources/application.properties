spring.application.name=Shrtrl

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

clickhouse.endpoint=${CLICKHOUSE_ENDPOINT:http://localhost:8123}
clickhouse.username=${CLICKHOUSE_USERNAME:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}
clickhouse.database=${CLICKHOUSE_DATABASE:default}

app.redis.uri=${REDIS_URI:redis://localhost:6379}
app.cache.url-ttl-seconds=${URL_CACHE_TTL_SECONDS:3600}
app.analytics.transport=${ANALYTICS_TRANSPORT:redis}
